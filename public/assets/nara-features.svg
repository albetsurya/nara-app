<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="auto">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B2A20" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1100" height="480" rx="20" fill="#F8F6F1" stroke="#E9E2D5" stroke-width="2" />

  <!-- Title & Subtitle -->
  <text x="550" y="44" fill="#1B2A20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">✨ Alur Pengalaman Menulis di Nara</text>
  <text x="550" y="68" fill="#6B7770" font-family="sans-serif" font-size="13" text-anchor="middle">Didesain tenang, minimalis, dan suportif dari langkah pertama hingga refleksi jangka panjang</text>

  <!-- Flow 1: Check-in / Companion -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="220" height="340" rx="18" fill="#FFFFFF" stroke="#ECE4D6" stroke-width="1.5" />
    <!-- Header Badge -->
    <rect x="16" y="16" width="60" height="24" rx="12" fill="#E8F1EC" />
    <text x="46" y="32" fill="#2C6E49" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 1</text>
    <text x="16" y="64" fill="#1B2A20" font-family="sans-serif" font-size="16" font-weight="700">Teman Tenang</text>
    <text x="16" y="84" fill="#6B7770" font-family="sans-serif" font-size="12">Sapaan hangat dari Pip</text>
    
    <!-- Mini Graphic -->
    <rect x="16" y="102" width="188" height="150" rx="12" fill="#F9F7F2" stroke="#EDE5D7" stroke-width="1" />
    <circle cx="110" cy="160" r="32" fill="#D5E3F3" />
    <circle cx="100" cy="155" r="3" fill="#2F3B54" />
    <circle cx="120" cy="155" r="3" fill="#2F3B54" />
    <path d="M104 168 Q110 174 116 168" fill="none" stroke="#2F3B54" stroke-width="2" stroke-linecap="round"/>
    <text x="110" y="224" fill="#5F6D65" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Siap mendengarkanmu</text>

    <text x="16" y="278" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">Mulai hari dengan check-in</text>
    <text x="16" y="296" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">singkat atau cerita santai</text>
    <text x="16" y="314" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">bersama companion.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M272 260 L292 260" stroke="#C4B9A7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" />
  <polygon points="295,260 287,255 287,265" fill="#C4B9A7" />

  <!-- Flow 2: Target & Timer -->
  <g transform="translate(305, 95)" filter="url(#cardShadow)">
    <rect width="220" height="340" rx="18" fill="#FFFFFF" stroke="#ECE4D6" stroke-width="1.5" />
    <rect x="16" y="16" width="60" height="24" rx="12" fill="#FEF3D6" />
    <text x="46" y="32" fill="#B45309" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 2</text>
    <text x="16" y="64" fill="#1B2A20" font-family="sans-serif" font-size="16" font-weight="700">Ritme Waktu</text>
    <text x="16" y="84" fill="#6B7770" font-family="sans-serif" font-size="12">Target harian tanpa cemas</text>
    
    <rect x="16" y="102" width="188" height="150" rx="12" fill="#F9F7F2" stroke="#EDE5D7" stroke-width="1" />
    <!-- Timer Dial Ring -->
    <circle cx="110" cy="165" r="40" fill="none" stroke="#E3DAC9" stroke-width="6" />
    <path d="M110 125 A40 40 0 0 1 150 165" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <text x="110" y="170" fill="#111111" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">5 mnt</text>
    <text x="110" y="224" fill="#5F6D65" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Menghitung saat mengetik</text>

    <text x="16" y="278" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">Pilih 1, 3, atau 5 menit.</text>
    <text x="16" y="296" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">Fokus menuangkan pikiran</text>
    <text x="16" y="314" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">tanpa rasa diburu-buru.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M537 260 L557 260" stroke="#C4B9A7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" />
  <polygon points="560,260 552,255 552,265" fill="#C4B9A7" />

  <!-- Flow 3: Rich Journaling -->
  <g transform="translate(570, 95)" filter="url(#cardShadow)">
    <rect width="220" height="340" rx="18" fill="#FFFFFF" stroke="#ECE4D6" stroke-width="1.5" />
    <rect x="16" y="16" width="60" height="24" rx="12" fill="#E8EEFA" />
    <text x="46" y="32" fill="#1E40AF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 3</text>
    <text x="16" y="64" fill="#1B2A20" font-family="sans-serif" font-size="16" font-weight="700">Tulis Lepas</text>
    <text x="16" y="84" fill="#6B7770" font-family="sans-serif" font-size="12">Ekspresi murni &amp; tenang</text>
    
    <rect x="16" y="102" width="188" height="150" rx="12" fill="#F9F7F2" stroke="#EDE5D7" stroke-width="1" />
    <!-- Note paper lines -->
    <rect x="36" y="125" width="148" height="8" rx="4" fill="#1B2A20" opacity="0.8" />
    <rect x="36" y="145" width="130" height="6" rx="3" fill="#A8B2AA" />
    <rect x="36" y="162" width="140" height="6" rx="3" fill="#A8B2AA" />
    <rect x="36" y="179" width="110" height="6" rx="3" fill="#A8B2AA" />
    <!-- Mood Tag mini -->
    <rect x="36" y="202" width="68" height="22" rx="11" fill="#E8F1EC" />
    <text x="70" y="217" fill="#2C6E49" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">✨ Damai</text>

    <text x="16" y="278" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">Editor Tiptap yang bersih,</text>
    <text x="16" y="296" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">pemilih suasana hati,</text>
    <text x="16" y="314" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">dan draf aman tersimpan.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M802 260 L822 260" stroke="#C4B9A7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" />
  <polygon points="825,260 817,255 817,265" fill="#C4B9A7" />

  <!-- Flow 4: Stamps & Insights -->
  <g transform="translate(835, 95)" filter="url(#cardShadow)">
    <rect width="225" height="340" rx="18" fill="#FFFFFF" stroke="#ECE4D6" stroke-width="1.5" />
    <rect x="16" y="16" width="60" height="24" rx="12" fill="#FCE7F3" />
    <text x="46" y="32" fill="#9D174D" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 4</text>
    <text x="16" y="64" fill="#1B2A20" font-family="sans-serif" font-size="16" font-weight="700">Stempel &amp; Pola</text>
    <text x="16" y="84" fill="#6B7770" font-family="sans-serif" font-size="12">Apresiasi pencapaianmu</text>
    
    <rect x="16" y="102" width="193" height="150" rx="12" fill="#F9F7F2" stroke="#EDE5D7" stroke-width="1" />
    <!-- Stamp Badge Illustration -->
    <rect x="68" y="125" width="80" height="85" rx="16" fill="#FFFFFF" stroke="#E3DAC9" stroke-width="1.5" />
    <circle cx="108" cy="158" r="18" fill="#FDE7D2" />
    <text x="108" y="165" font-size="18" text-anchor="middle">🏆</text>
    <text x="108" y="196" fill="#1B2A20" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">STAMP #1</text>
    <text x="112" y="235" fill="#5F6D65" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Buka koleksi stempel</text>

    <text x="16" y="278" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">Dapatkan stempel kebiasaan</text>
    <text x="16" y="296" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">serta renungan lembut dari</text>
    <text x="16" y="314" fill="#3D4A41" font-family="sans-serif" font-size="11.5" font-weight="500">analisis jurnal 14 harimu.</text>
  </g>
</svg>
