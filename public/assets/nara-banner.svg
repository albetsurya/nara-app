<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#ECE5D8" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B2A20" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B2A20" flood-opacity="0.04" />
    </filter>
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#111111" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#E3DAC9" stroke-width="2" />

  <!-- Soft Decorative Circles / Ambience -->
  <circle cx="150" cy="80" r="120" fill="#E8F1EC" opacity="0.6" />
  <circle cx="1060" cy="320" r="140" fill="#F9E8D9" opacity="0.5" />
  <circle cx="650" cy="380" r="90" fill="#E2EBE5" opacity="0.5" />

  <!-- Left Side: App Intro & Branding -->
  <g transform="translate(90, 85)">
    <!-- Small Tag -->
    <rect width="148" height="32" rx="16" fill="#1B2A20" />
    <text x="74" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">MINDFUL JOURNAL</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#1B2A20" font-family="-apple-system, BlinkMacSystemFont, 'Recoleta', Georgia, serif" font-size="56" font-weight="800" letter-spacing="-1">nara</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="125" fill="#2C3E33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Ruang tenang untuk pikiran, cerita, dan kebiasaanmu.</text>
    <text x="0" y="155" fill="#5F6D65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Teman refleksi harian hangat dengan dukungan AI privat, stempel kebiasaan,</text>
    <text x="0" y="178" fill="#5F6D65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">serta target waktu menulis yang lembut dan bermakna.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="135" height="36" rx="18" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5" />
      <circle cx="20" cy="18" r="6" fill="#6FD0A8" />
      <text x="34" y="23" fill="#2C3E33" font-family="sans-serif" font-size="13" font-weight="600">Companion AI</text>

      <rect x="147" y="0" width="135" height="36" rx="18" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5" />
      <circle cx="167" cy="18" r="6" fill="#F4A9BA" />
      <text x="181" y="23" fill="#2C3E33" font-family="sans-serif" font-size="13" font-weight="600">Streak Stamps</text>

      <rect x="294" y="0" width="145" height="36" rx="18" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5" />
      <circle cx="314" cy="18" r="6" fill="#F0C674" />
      <text x="328" y="23" fill="#2C3E33" font-family="sans-serif" font-size="13" font-weight="600">100% Offline PWA</text>
    </g>
  </g>

  <!-- Right Side: Phone / Device Mockup preview -->
  <g transform="translate(820, 30)" filter="url(#softShadow)">
    <!-- Device Frame -->
    <rect width="280" height="360" rx="36" fill="#1C1D1F" stroke="#36383D" stroke-width="4" />
    <rect x="10" y="10" width="260" height="340" rx="28" fill="#FAF8F5" />
    
    <!-- Phone Speaker Notch -->
    <rect x="105" y="18" width="70" height="6" rx="3" fill="#D3CBBB" />

    <!-- In-App Header -->
    <text x="30" y="52" fill="#1B2A20" font-family="serif" font-size="18" font-weight="800">nara</text>
    <circle cx="240" cy="48" r="13" fill="#ECE5D8" />
    <circle cx="240" cy="45" r="4.5" fill="#5F6D65" />
    <path d="M233 55 C233 51 247 51 247 55" fill="none" stroke="#5F6D65" stroke-width="2" stroke-linecap="round" />

    <!-- In-App Companion Card -->
    <rect x="24" y="70" width="232" height="92" rx="20" fill="#FFFFFF" stroke="#EFE9DC" stroke-width="1.5" />
    
    <!-- Pip Avatar Mini inside Card -->
    <g transform="translate(36, 82) scale(0.38)">
      <path d="M97 68C97 54 98 44 100 32L104 32C103 44 103 56 103 68Z" fill="#6FD0A8"/>
      <path d="M100 42C86 42 72 36 65 23C80 19 96 26 100 42Z" fill="#8FE3C0"/>
      <path d="M102 36C104 21 118 13 135 15C135 30 120 40 102 36Z" fill="#7CDCB4"/>
      <path d="M100 62C148 62 176 98 176 138C176 176 144 196 100 196C56 196 24 176 24 138C24 98 52 62 100 62Z" fill="#A9B9CE"/>
      <circle cx="76" cy="136" r="11" fill="#2F3B54"/>
      <circle cx="79.8" cy="131.6" r="4" fill="#fff"/>
      <circle cx="124" cy="136" r="11" fill="#2F3B54"/>
      <circle cx="127.8" cy="131.6" r="4" fill="#fff"/>
      <ellipse cx="57" cy="153" rx="10" ry="6.5" fill="#F4A9BA" opacity=".75"/>
      <ellipse cx="143" cy="153" rx="10" ry="6.5" fill="#F4A9BA" opacity=".75"/>
      <path d="M91 151Q100 160 109 151" fill="none" stroke="#2F3B54" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Dialog speech from companion -->
    <text x="110" y="98" fill="#1B2A20" font-family="sans-serif" font-size="13" font-weight="700">Hai, kawan!</text>
    <text x="110" y="116" fill="#6B7770" font-family="sans-serif" font-size="10.5">Bagaimana harimu berjalan?</text>
    <text x="110" y="132" fill="#6B7770" font-family="sans-serif" font-size="10.5">Ada cerita kecil hari ini?</text>

    <!-- In-App Action: New Journal Entry CTA -->
    <rect x="24" y="172" width="232" height="44" rx="22" fill="#111111" filter="url(#pillShadow)" />
    <text x="140" y="199" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">✏️ Tulis Catatan Baru</text>

    <!-- In-App Stamp Preview Section -->
    <rect x="24" y="226" width="232" height="100" rx="18" fill="#FFFFFF" stroke="#EFE9DC" stroke-width="1.5" />
    <text x="36" y="246" fill="#1B2A20" font-family="sans-serif" font-size="11" font-weight="700">Stempel Koleksimu</text>
    
    <!-- Mini Stamp Badge 1 -->
    <g transform="translate(38, 256)">
      <rect width="52" height="56" rx="12" fill="#F6F3EB" stroke="#E6DFD1" stroke-width="1"/>
      <circle cx="26" cy="24" r="14" fill="#D5E3F3" />
      <text x="26" y="28" font-size="14" text-anchor="middle">🌱</text>
      <text x="26" y="48" fill="#2C3E33" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">Pertama</text>
    </g>

    <!-- Mini Stamp Badge 2 -->
    <g transform="translate(100, 256)">
      <rect width="52" height="56" rx="12" fill="#F6F3EB" stroke="#E6DFD1" stroke-width="1"/>
      <circle cx="26" cy="24" r="14" fill="#FDE7D2" />
      <text x="26" y="28" font-size="14" text-anchor="middle">🔥</text>
      <text x="26" y="48" fill="#2C3E33" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">3 Hari</text>
    </g>

    <!-- Mini Stamp Badge 3 -->
    <g transform="translate(162, 256)">
      <rect width="52" height="56" rx="12" fill="#F6F3EB" stroke="#E6DFD1" stroke-width="1"/>
      <circle cx="26" cy="24" r="14" fill="#E2F1E8" />
      <text x="26" y="28" font-size="14" text-anchor="middle">⭐</text>
      <text x="26" y="48" fill="#2C3E33" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">Seminggu</text>
    </g>
  </g>
</svg>
